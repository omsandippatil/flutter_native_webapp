name: tapapp
description: Gamified learning app for school students with videos, projects and quizzes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.3
  google_fonts: ^8.1.0
  dio: ^5.7.0
  hive_ce_flutter: ^2.3.4
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.3
  path_provider: ^2.1.1
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  image_picker: ^1.2.0
  youtube_player_flutter: ^9.0.4
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  isar_generator: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/onboarding/
    - assets/class-screen/
    - assets/home-screen/
    - assets/reveal/
    - assets/splash-screen/
    - assets/error-screen-assets/
    - assets/data/courses/
    - assets/data/courses/thumbnail/
    - assets/flows/
    - assets/flows/en/activity/
    - assets/flows/en/onboarding/
    - assets/data/states/