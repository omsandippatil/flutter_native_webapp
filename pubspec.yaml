name: tapapp
description: 'A new Flutter project.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  flutter_riverpod: ^2.6.1
  google_fonts: ^8.1.0
  shared_preferences: ^2.3.3
  dio: ^5.7.0
  hive_ce_flutter: ^2.3.4
  flutter_secure_storage: ^10.3.1
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.1
  riverpod_annotation: ^2.3.3
  image_picker: ^1.2.0
  youtube_player_flutter: ^9.0.4
  url_launcher: ^6.3.2

  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/splash-screen/
    - assets/error-screen-assets/
    - assets/onboarding/
    - assets/home-screen/
    - assets/class-screen/
    - assets/profile-screen/
    - assets/data/content/
    - assets/data/content/thumbnail/
    - assets/flows/en/
    - assets/flows/en/activity/
    - assets/flows/en/onboarding/
    - assets/data/courses/en/
    - assets/data/courses/hi/
    - assets/data/courses/mr/
    - assets/data/courses/kn/
    - assets/data/courses/pa/
    - assets/data/constants/
    - assets/data/district/
    - assets/data/courses/thumbnail/
    - assets/reveal/
