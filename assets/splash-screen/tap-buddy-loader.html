<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAP Buddy — Flying-Up Loader</title>
    <style>
      :root {
        /* --- your palette, ground-up --- */
        --c1: #ffffff; /* ground / bright */
        --c2: #f8ea21; /* lower */
        --c3: #47bdc5; /* mid sky */
        --c4: #113236; /* high / "up there" */
        --circle: 320px;
        --loop: 8s; /* master loop; every sub-anim divides this for a seamless video */
        --page: #113236; /* matte behind the circle (masked away in Figma) */
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--page);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, system-ui, sans-serif;
      }

      /* ---- the circular mask: applied at the container, not baked into the art ---- */
      .scope {
        width: var(--circle);
        height: var(--circle);
        border-radius: 50%;
        overflow: hidden;
        position: relative;
        isolation: isolate;
      }
      .scope::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        z-index: 9;
        pointer-events: none;
        box-shadow: inset 0 0 38px rgba(0, 0, 0, 0.28);
      } /* soft vignette */

      /* ---- altitude gradient: repeating ground->space, scrolled down = continuous climb ---- */
      .strip {
        position: absolute;
        inset: -1px;
        z-index: 0;
        background-image: linear-gradient(
          to top,
          var(--c1) 0%,
          var(--c2) 21%,
          var(--c3) 45%,
          var(--c4) 70%,
          var(--c4) 86%,
          var(--c1) 100%
        );
        background-size: 100% 640px; /* one full ground->space cycle = 2x circle */
        background-repeat: repeat-y;
        animation: climb var(--loop) linear infinite;
      }
      @keyframes climb {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 0 640px;
        }
      }

      /* ---- sparkles that read up high (timed to the dark-teal window) ---- */
      .stars {
        position: absolute;
        inset: 0;
        z-index: 1;
        animation: starwin var(--loop) ease-in-out infinite;
      }
      @keyframes starwin {
        0%,
        46% {
          opacity: 0;
        }
        62%,
        82% {
          opacity: 0.95;
        }
        94%,
        100% {
          opacity: 0;
        }
      }
      .star {
        position: absolute;
        background: #fff;
        border-radius: 50%;
        animation: twinkle 2s ease-in-out infinite;
      }
      @keyframes twinkle {
        0%,
        100% {
          transform: scale(0.6);
          opacity: 0.5;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* ---- rushing-air streaks behind her (sells upward motion) ---- */
      .streaks {
        position: absolute;
        inset: 0;
        z-index: 2;
      }
      .streak {
        position: absolute;
        width: 2px;
        border-radius: 2px;
        background: linear-gradient(transparent, rgba(255, 255, 255, 0.75), transparent);
        animation: fall 2s linear infinite;
      }
      @keyframes fall {
        from {
          transform: translateY(-70px);
        }
        to {
          transform: translateY(390px);
        }
      }

      /* ---- soft drifting dust ---- */
      .dust {
        position: absolute;
        inset: 0;
        z-index: 3;
      }
      .mote {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.55);
        filter: blur(0.4px);
        animation: drift 4s linear infinite;
      }
      @keyframes drift {
        from {
          transform: translateY(-30px);
        }
        to {
          transform: translateY(360px);
        }
      }

      /* ---- Buddy: layered transforms so motions compose without fighting ---- */
      .buddy-pos {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 6;
        transform: translate(-50%, -50%);
        animation: bob 4s ease-in-out infinite;
      }
      @keyframes bob {
        0%,
        100% {
          margin-top: 6px;
        }
        50% {
          margin-top: -8px;
        }
      }
      .buddy-gust {
        animation: gust var(--loop) ease-in-out infinite;
        transform-origin: 50% 30%;
      }
      @keyframes gust {
        0%,
        26% {
          transform: rotate(0) translateY(0);
        }
        36% {
          transform: rotate(-6deg) translateY(-6px);
        }
        48%,
        100% {
          transform: rotate(0) translateY(0);
        }
      }
      .buddy-sway {
        animation: sway var(--loop) ease-in-out infinite;
        transform-origin: 50% 80%;
      }
      @keyframes sway {
        0%,
        100% {
          transform: rotate(-3deg);
        }
        50% {
          transform: rotate(3deg);
        }
      }
      .buddy-breathe {
        animation: breathe var(--loop) ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.03);
        }
      }
      .buddy-img {
        display: block;
        height: 218px;
        width: auto;
        filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.3));
      }
    </style>
  </head>

    <script>
      const R = (a, b) => a + Math.random() * (b - a);
      const stars = document.getElementById('stars');
      for (let i = 0; i < 22; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const d = R(1.3, 2.6);
        s.style.cssText = `left:${R(8, 92)}%;top:${R(8, 60)}%;width:${d}px;height:${d}px;animation-delay:${R(-2, 0)}s`;
        stars.appendChild(s);
      }
      const streaks = document.getElementById('streaks');
      for (let i = 0; i < 12; i++) {
        const l = document.createElement('div');
        l.className = 'streak';
        l.style.cssText = `left:${R(8, 92)}%;height:${R(20, 44)}px;opacity:${R(0.35, 0.8)};animation-delay:${R(-2, 0)}s`;
        streaks.appendChild(l);
      }
      const dust = document.getElementById('dust');
      for (let i = 0; i < 9; i++) {
        const m = document.createElement('div');
        m.className = 'mote';
        const d = R(4, 8);
        m.style.cssText = `left:${R(6, 94)}%;width:${d}px;height:${d}px;animation-delay:${R(-4, 0)}s`;
        dust.appendChild(m);
      }
    </script>
