name: tapapp
description: 'A new Flutter project.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  flutter_riverpod: ^2.6.1
  google_fonts: ^8.1.0
  shared_preferences: ^2.3.3
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/splash-screen/
    - assets/error-screen-assets/
    - assets/onboarding/
    - assets/home-screen/
    - assets/class-screen/
    - assets/profile-screen/
    - assets/data/content/
    - assets/data/content/thumbnail/
    - assets/flows/flow_manifest.json
    - assets/flows/en/
    - assets/flows/en/auth/
    - assets/flows/en/onboarding/
    - assets/flows/en/activity/
    - assets/flows/en/course/
    - assets/flows/
    - assets/data/courses/en/
    - assets/data/courses/hi/
    - assets/data/courses/mr/
    - assets/data/courses/kn/
    - assets/data/courses/pa/
