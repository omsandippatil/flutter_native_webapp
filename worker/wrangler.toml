name = "tapapp-proxy"
main = "src/worker.js"
compatibility_date = "2024-01-01"

[vars]
FRAPPE_BASE_URL = "https://your-frappe-instance.example.com"
JWT_SECRET = "test-jwt-secret-change-me"
SMS_API_KEY = "test-sms-api-key-change-me"
TAPAPP_APPSHEET_WEBAPP_URL = "https://script.google.com/macros/s/your-script-id/exec"
TAPAPP_APPSHEET_WEBAPP_SECRET = "test-appsheet-secret-change-me"

[[kv_namespaces]]
binding    = "KV"
id         = "your-kv-namespace-id"
preview_id = "your-kv-preview-id"